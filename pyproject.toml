[project]
name = "iikocloud_client"
version = "0.1.0"
description = "iikoCloud API"
authors = [
  {name = "OpenAPI Generator Community",email = "team@openapitools.org"},
]
readme = "README.md"
keywords = ["OpenAPI", "OpenAPI-Generator", "iikoCloud API"]
requires-python = ">=3.10"

dependencies = [
  "urllib3 (>=2.1.0,<3.0.0)",
  "python-dateutil (>=2.8.2)",
  "aiohttp (>=3.8.4)",
  "aiohttp-retry (>=2.8.3)",
  "pydantic (>=2)",
  "typing-extensions (>=4.7.1)",
  "lazy-imports (>=1,<2)"
]

[project.urls]
Repository = "https://github.com/GIT_USER_ID/GIT_REPO_ID"

[tool.poetry]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">= 7.2.1"
pytest-cov = ">= 2.8.1"
tox = ">= 3.9.0"
flake8 = ">= 4.0.0"
types-python-dateutil = ">= 2.8.19.14"
mypy = ">= 1.5"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "detect-secrets==1.5.0",
  "jsonpath-rfc9535==1.0.0",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6.0.3,<7",
  "ruff>=0.12,<1",
  "setuptools>=77,<82",
  "tomli>=2.2,<3; python_version < '3.11'",
  "types-pyyaml>=6.0.12,<7",
]
package-check = [
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "python-dateutil==2.9.0.post0",
  "typing-extensions==4.15.0",
]

[tool.uv]
default-groups = ["dev", "package-check"]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.mypy]
files = [
  "iikocloud_client",
  #"test",  # auto-generated tests
  "tests", # hand-written tests
]
# TODO: enable "strict" once all these individual checks are passing
# strict = true

# List from: https://mypy.readthedocs.io/en/stable/existing_code.html#introduce-stricter-options
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

## Getting these passing should be easy
strict_equality = true
extra_checks = true

## Strongly recommend enabling this one as soon as you can
check_untyped_defs = true

## These shouldn't be too much additional work, but may be tricky to
## get passing if you use a lot of untyped libraries
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true

### These next few are various gradations of forcing use of type annotations
#disallow_untyped_calls = true
#disallow_incomplete_defs = true
#disallow_untyped_defs = true
#
### This one isn't too hard to get passing, but return on investment is lower
#no_implicit_reexport = true
#
### This one can be tricky to get passing if you use a lot of untyped libraries
#warn_return_any = true

[[tool.mypy.overrides]]
module = [
  "iikocloud_client.configuration",
]
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "docker: requires the pinned OpenAPI Generator image",
  "live_read_smoke: minimal live read contract checks",
  "live_read_full: extended live read contract checks",
  "live_write: explicit mutating checks",
]
addopts = "-m 'not docker and not live_read_smoke and not live_read_full and not live_write'"

[tool.ruff]
target-version = "py310"
line-length = 99
exclude = ["src/iikocloud_client/api", "src/iikocloud_client/models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
