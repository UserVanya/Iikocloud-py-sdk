name: offline

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install frozen development environment
        run: uv sync --frozen --group dev
      - name: Lint hand-written code and tests
        run: uv run --frozen --offline ruff check tools tests
      - name: Test evidence candidate writer in a fresh process
        run: uv run --frozen --offline pytest -q tests/pipeline/test_evidence_candidate_writer.py
      - name: Test evidence candidate contracts in a fresh process
        run: >-
          uv run --frozen --offline pytest -q
          tests/pipeline/test_evidence_candidate_contract.py
          tests/pipeline/test_evidence_candidate_store.py
          tests/pipeline/test_evidence_candidates.py
          -k "not locally_composed"
      - name: Test evidence analysis in a fresh process
        run: >-
          uv run --frozen --offline pytest -q
          tests/pipeline/test_evidence_analysis.py
          tests/pipeline/test_evidence_promotion_reader.py
          -k "not locally_composed"
      - name: Test saved public candidate builder in a fresh process
        run: >-
          uv run --frozen --offline pytest -q
          tests/pipeline/test_evidence_candidates.py::test_builder_smoke_uses_public_locally_composed_candidate_without_fetch
      - name: Test saved public candidate analyzer in a fresh process
        run: >-
          uv run --frozen --offline pytest -q
          tests/pipeline/test_evidence_analysis.py::test_analyzer_smoke_uses_the_locally_composed_reviewed_schema_without_fetch
      - name: Test capture support in a fresh process
        run: uv run --frozen --offline pytest -q tests/capture
      - name: Test live safety support in a fresh process
        run: uv run --frozen --offline pytest -q tests/live_support
      - name: Test remaining offline suite in a fresh process
        run: >-
          uv run --frozen --offline pytest -q tests
          --ignore=tests/capture
          --ignore=tests/live_support
          --ignore=tests/pipeline/test_evidence_candidate_writer.py
          --ignore=tests/pipeline/test_evidence_candidate_contract.py
          --ignore=tests/pipeline/test_evidence_candidate_store.py
          --ignore=tests/pipeline/test_evidence_candidates.py
          --ignore=tests/pipeline/test_evidence_analysis.py
          --ignore=tests/pipeline/test_evidence_promotion_reader.py
      - name: Verify repository contains no secrets
        run: uv run --frozen --offline python -m tools.openapi_pipeline verify-no-secrets
      - name: Build wheel and source distribution
        run: uv build --offline
      - if: matrix.python-version == '3.12'
        name: Type-check pipeline
        run: uv run --frozen --offline mypy tools/openapi_pipeline
      - if: matrix.python-version == '3.12'
        name: Pull pinned OpenAPI Generator image
        run: >-
          docker pull
          openapitools/openapi-generator-cli@sha256:1f459499a7c794aa0ea769c3c9b0eb54806c5ad2f68510a0ebb9338d0a626ced
      - if: matrix.python-version == '3.12'
        name: Verify generated SDK matches reviewed inputs
        run: uv run --frozen --offline python -m tools.openapi_pipeline verify
