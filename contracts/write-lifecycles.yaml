version: 1
scenarios:
  stop_list_product:
    enabled: true
    requires_profile_fields: [terminal_group_id, write_product_id]
    ownership_marker:
      source: profile_field
      field: write_product_id
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_stop_lists}
      - {role: create, operation: add_products_to_stop_list}
      - {role: cleanup, operation: remove_products_from_stop_list, compensates: add_products_to_stop_list}
  customer:
    enabled: true
    requires_profile_fields: []
    ownership_marker:
      source: literal
      field: phone
      value: "+70000000042"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: create, operation: create_or_update_customer}
      - {role: check, operation: get_customer_info}
      - {role: cleanup, operation: delete_customers, compensates: create_or_update_customer}
  customer_category:
    enabled: true
    requires_profile_fields: []
    ownership_marker:
      source: literal
      field: phone
      value: "+70000000042"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_customer_categories}
      - {role: create, operation: create_or_update_customer}
      - {role: create, operation: add_customer_category}
      - {role: cleanup, operation: remove_customer_category, compensates: add_customer_category}
      - {role: cleanup, operation: delete_customers, compensates: create_or_update_customer}
  customer_magnet_card:
    enabled: true
    requires_profile_fields: []
    ownership_marker:
      source: literal
      field: cardNumber
      value: "7999000000000042"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: create, operation: create_or_update_customer}
      - {role: create, operation: add_customer_magnet_card}
      - {role: cleanup, operation: remove_customer_magnet_card, compensates: add_customer_magnet_card}
      - {role: cleanup, operation: delete_customers, compensates: create_or_update_customer}
  delivery_order:
    enabled: true
    requires_profile_fields: [terminal_group_id, write_product_id]
    ownership_marker:
      source: literal
      field: phone
      value: "+70000000042"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_external_menu_by_id}
      - {role: prepare, operation: get_delivery_order_types}
      - {role: create, operation: create_delivery_order}
      - {role: check, operation: get_deliveries_by_id}
      - {role: cleanup, operation: cancel_delivery_order, compensates: create_delivery_order}
  draft_flow:
    enabled: true
    requires_profile_fields: [terminal_group_id, write_product_id]
    ownership_marker:
      source: literal
      field: phone
      value: "+70000000042"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_external_menu_by_id}
      - {role: prepare, operation: get_delivery_order_types}
      - {role: prepare, operation: get_couriers}
      - {role: create, operation: create_delivery_draft}
      - {role: create, operation: lock_delivery_draft}
      - {role: cleanup, operation: unlock_delivery_draft, compensates: lock_delivery_draft}
      - {role: mutate, operation: save_delivery_draft}
      - {role: create, operation: commit_delivery_draft}
      - {role: check, operation: get_deliveries_by_id}
      - {role: cleanup, operation: cancel_delivery_order, compensates: commit_delivery_draft}
      - {role: cleanup, operation: delete_delivery_draft, compensates: create_delivery_draft}
  reserve:
    enabled: false
    disabled_reason: "Async reserve creation never completes on the stand; get_command_status stays InProgress and the reserve never appears in the section workload. Re-probed 2026-07-25 after a full POS terminal reinstall, after a hall scheme was added in iikoWeb, after the Cloud API plugin update, with the front confirmed alive via check_terminal_groups_availability, and with a daytime estimated start: still InProgress every time. The front accepts the command but never executes it; check the iikoFront logs on the stand for the reserve command."
    requires_profile_fields: [terminal_group_id]
    ownership_marker:
      source: literal
      field: phone
      value: "+70000000042"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_reserve_restaurant_sections}
      - {role: create, operation: create_reserve}
      - {role: check, operation: get_reserve_statuses_by_id}
      - {role: cleanup, operation: cancel_reserve, compensates: create_reserve}
  table_order:
    enabled: true
    requires_profile_fields: [terminal_group_id, write_product_id]
    ownership_marker:
      source: literal
      field: phone
      value: "+70000000042"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_reserve_restaurant_sections}
      - {role: prepare, operation: get_external_menu_by_id}
      - {role: create, operation: create_table_order}
      - {role: check, operation: get_table_orders_by_id}
      - {role: cleanup, operation: cancel_table_order, compensates: create_table_order}
  delivery_order_full:
    enabled: true
    requires_profile_fields: [terminal_group_id, write_product_id]
    ownership_marker:
      source: literal
      field: phone
      value: "+70000000042"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_external_menu_by_id}
      - {role: prepare, operation: get_delivery_order_types}
      - {role: prepare, operation: get_couriers}
      - {role: prepare, operation: get_payment_types}
      - {role: create, operation: create_delivery_order}
      - {role: mutate, operation: add_delivery_order_items}
      - {role: mutate, operation: change_delivery_comment}
      - {role: mutate, operation: change_delivery_complete_before}
      - {role: mutate, operation: change_delivery_operator}
      - {role: mutate, operation: update_delivery_order_problem}
      - {role: mutate, operation: update_delivery_tracking_link}
      - {role: mutate, operation: change_delivery_external_data}
      - {role: mutate, operation: update_delivery_order_status}
      - {role: mutate, operation: add_delivery_order_payments}
      - {role: mutate, operation: print_delivery_bill}
      - {role: check, operation: get_deliveries_by_id}
      - {role: cleanup, operation: cancel_delivery_order, compensates: create_delivery_order}
  misc_ops:
    enabled: true
    requires_profile_fields: [terminal_group_id, write_product_id]
    ownership_marker:
      source: literal
      field: sourceKey
      value: "sdk-write-probe"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_webhook_settings}
      - {role: prepare, operation: get_stop_lists}
      - {role: mutate, operation: update_inventory_product_barcodes}
      - {role: mutate, operation: update_webhook_settings}
      - {role: mutate, operation: awake_terminal_groups}
      - {role: mutate, operation: clear_stop_list}
  session_ops:
    enabled: true
    requires_profile_fields: [terminal_group_id]
    ownership_marker:
      source: literal
      field: sourceKey
      value: "sdk-write-probe"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_couriers}
      - {role: prepare, operation: get_personal_session_info}
      - {role: create, operation: open_personal_session}
      - {role: cleanup, operation: close_personal_session, compensates: open_personal_session}
  finalization:
    enabled: true
    requires_profile_fields: [terminal_group_id, write_product_id]
    ownership_marker:
      source: literal
      field: phone
      value: "+70000000042"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_external_menu_by_id}
      - {role: prepare, operation: get_delivery_order_types}
      - {role: prepare, operation: get_reserve_restaurant_sections}
      - {role: create, operation: create_delivery_order}
      - {role: create, operation: confirm_delivery}
      - {role: cleanup, operation: cancel_delivery_confirmation, compensates: confirm_delivery}
      - {role: mutate, operation: close_delivery_order}
      - {role: cleanup, operation: cancel_delivery_order, compensates: create_delivery_order}
      - {role: create, operation: create_table_order}
      - {role: mutate, operation: close_table_order}
      - {role: cleanup, operation: cancel_table_order, compensates: create_table_order}
  delivery_order_courier:
    enabled: true
    requires_profile_fields: [terminal_group_id, write_product_id]
    ownership_marker:
      source: literal
      field: phone
      value: "+70000000042"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_external_menu_by_id}
      - {role: prepare, operation: get_delivery_order_types}
      - {role: prepare, operation: get_couriers}
      - {role: prepare, operation: get_cities}
      - {role: prepare, operation: get_streets_by_city}
      - {role: create, operation: create_delivery_order}
      - {role: mutate, operation: update_delivery_order_courier}
      - {role: mutate, operation: change_delivery_driver_info}
      - {role: check, operation: get_deliveries_by_id}
      - {role: cleanup, operation: cancel_delivery_order, compensates: create_delivery_order}
  delivery_draft:
    enabled: true
    requires_profile_fields: [terminal_group_id, write_product_id]
    ownership_marker:
      source: literal
      field: phone
      value: "+70000000042"
    steps:
      - {role: prepare, operation: get_organizations}
      - {role: prepare, operation: get_external_menu_by_id}
      - {role: prepare, operation: get_delivery_order_types}
      - {role: create, operation: create_delivery_draft}
      - {role: check, operation: get_delivery_draft_by_id}
      - {role: cleanup, operation: delete_delivery_draft, compensates: create_delivery_draft}
