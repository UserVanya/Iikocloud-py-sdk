actions:
- target: $
  update:
    servers:
    - url: https://api-ru.iiko.services
  x-iiko-sdk-guard:
    expected-matches: 1
    expected-sha256: e039f589fb391ff28504d72e1c1322484f4f1bb6c13793913cc31faabaabf259
    issue: iiko-root-server
- target: $.components
  update:
    securitySchemes:
      BearerAuth:
        scheme: bearer
        type: http
  x-iiko-sdk-guard:
    expected-matches: 1
    expected-sha256: c61a87c2cc6ba26818c36fea8b953caa40ead40d6a1d872aa5a4a19212efd012
    issue: iiko-bearer-scheme
- remove: true
  target: $.paths.*.*.parameters[?@.in == "header" && @.name == "Authorization"]
  x-iiko-sdk-guard:
    expected-matches: 336
    expected-sha256: f7c8e116d624d9b09997151e6b72c1833a6254205d328620fe686eec02f1021f
    issue: remove-raw-authorization-parameters
- target: $.paths.*["delete","get","head","options","patch","post","put","trace"]
  update:
    security:
    - BearerAuth: []
  x-iiko-sdk-guard:
    expected-matches: 338
    expected-sha256: 730232d4a7751177b3b46a440640491d74cbfa97806846e9b4ec648e4180df94
    issue: require-bearer-authentication
- remove: true
  target: $.paths["/api/1/access_token"].post.security
  x-iiko-sdk-guard:
    expected-matches: 1
    expected-sha256: 51fb15f6c687b94455573657bb06f530f641ef40392c60b1cc0de361a01e9550
    issue: remove-bearer-from-post-/api/1/access_token
- target: $.paths["/api/1/access_token"].post
  update:
    security: []
  x-iiko-sdk-guard:
    expected-matches: 1
    expected-sha256: 94e390264b30c11196ff6661044ccc92192c20d8521ac1074b8a94b7a78d9ae3
    issue: mark-post-/api/1/access_token-public
- remove: true
  target: $.paths["/api/v2/access_token"].post.security
  x-iiko-sdk-guard:
    expected-matches: 1
    expected-sha256: 51fb15f6c687b94455573657bb06f530f641ef40392c60b1cc0de361a01e9550
    issue: remove-bearer-from-post-/api/v2/access_token
- target: $.paths["/api/v2/access_token"].post
  update:
    security: []
  x-iiko-sdk-guard:
    expected-matches: 1
    expected-sha256: 0400c18538ab81320a876fbd2cdcb17a407989f4b9f3a5c9c22e9986fe05b9a2
    issue: mark-post-/api/v2/access_token-public
info:
  title: iiko Cloud bearer authentication contract
  version: 1.0.0
overlay: 1.1.0
